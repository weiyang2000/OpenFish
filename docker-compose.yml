services:
  api:
    build:
      context: .
      args:
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYPI_EXTRA_INDEX_URLS: ${PYPI_EXTRA_INDEX_URLS:-}
        BETTAFISH_TORCH_VARIANT: ${BETTAFISH_TORCH_VARIANT:-auto}
        PYTORCH_CUDA_INDEX_URL: ${PYTORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
        SCRAPLING_INSTALL_BROWSERS: ${SCRAPLING_INSTALL_BROWSERS:-true}
    container_name: bettafish-api
    restart: unless-stopped
    depends_on:
      - db
    command: uvicorn apps.api.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - BETTAFISH_API_ARTIFACT_DIR=/app/data/saas_api_artifacts
      - BETTAFISH_API_RUN_WORKERS=${BETTAFISH_API_RUN_WORKERS:-true}
      - BETTAFISH_API_CRAWLER_ADAPTER=${BETTAFISH_API_CRAWLER_ADAPTER:-real}
      - BETTAFISH_API_CORS_ORIGINS=${BETTAFISH_API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000}
      - BETTAFISH_CRAWLER_BROWSER_DATA_DIR=${BETTAFISH_CRAWLER_BROWSER_DATA_DIR:-/app/data/browser_data}
      - CRAWLER_ENGINE=${CRAWLER_ENGINE:-scrapling}
      - DISPLAY=${DISPLAY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_DIALECT=${DB_DIALECT:-postgresql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-bettafish}
      - DB_PASSWORD=${DB_PASSWORD:-bettafish}
      - DB_NAME=${DB_NAME:-bettafish}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
        NEXT_PUBLIC_WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    container_name: bettafish-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_USE_MOCKS=${NEXT_PUBLIC_USE_MOCKS:-false}
      - NEXT_PUBLIC_WORKSPACE_ID=${NEXT_PUBLIC_WORKSPACE_ID:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

  db:
    image: postgres:15
    container_name: bettafish-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bettafish}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bettafish}
      POSTGRES_DB: ${DB_NAME:-bettafish}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
