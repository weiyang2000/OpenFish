openapi: 3.1.0
info:
  title: BettaFish SaaS Platform API
  version: 0.1.0
  summary: Contract for the BettaFish SaaS service layer.
  description: |
    This contract is the target API for the Next.js SaaS console. It intentionally
    does not mirror legacy UI routes one-for-one. Backend implementations may
    adapt existing engine services, but the frontend should call the versioned
    SaaS resources below.
servers:
  - url: http://localhost:8000/api/v1
    description: Local backend service
  - url: https://api.bettafish.example.com/api/v1
    description: SaaS deployment placeholder
security:
  - bearerAuth: []
tags:
  - name: System
    description: System health, component runtime state, logs, and service config.
  - name: Reports
    description: Multi-agent report task lifecycle, streaming progress, results, and exports.
  - name: Crawlers
    description: MindSpider crawling tasks and reusable crawl strategies.
  - name: Platforms
    description: Platform metadata and user identity allow/block list management.
  - name: Search
    description: Cross-engine query dispatch used by report preparation.

paths:
  /health:
    get:
      tags: [System]
      summary: Get service health and workspace context.
      operationId: getHealth
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /system/components:
    get:
      tags: [System]
      summary: List engine component runtime states.
      operationId: listSystemComponents
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Component states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemComponentsResponse"

  /system/components/{componentId}:start:
    post:
      tags: [System]
      summary: Start a component.
      operationId: startSystemComponent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ComponentId"
      responses:
        "202":
          description: Start requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /system/components/{componentId}:stop:
    post:
      tags: [System]
      summary: Stop a component.
      operationId: stopSystemComponent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ComponentId"
      responses:
        "202":
          description: Stop requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /system/config:
    get:
      tags: [System]
      summary: Read system configuration with sensitive values masked.
      operationId: getSystemConfig
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: includeSchema
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Masked config values and editable field metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfigResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [System]
      summary: Update system configuration.
      description: |
        Sensitive fields may be omitted to keep current values. A masked value
        such as `********` must be ignored by the backend and never persisted as
        the real secret.
      operationId: updateSystemConfig
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemConfigUpdateRequest"
            examples:
              updateSearchProvider:
                value:
                  updatedBy:
                    userId: user_demo
                    displayName: Demo Operator
                  values:
                    SEARCH_TOOL_TYPE: BochaAPI
                    BOCHA_WEB_SEARCH_API_KEY: sk-new-value
      responses:
        "200":
          description: Updated masked config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfigResponse"
        default:
          $ref: "#/components/responses/Error"

  /logs:
    get:
      tags: [System]
      summary: Read runtime logs.
      operationId: listLogs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/LogSource"
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: tail
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 300
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        default:
          $ref: "#/components/responses/Error"

  /search:
    post:
      tags: [Search]
      summary: Dispatch a query to selected engines.
      operationId: createSearchRun
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRunRequest"
      responses:
        "202":
          description: Search run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-templates:
    get:
      tags: [Reports]
      summary: List report templates.
      operationId: listReportTemplates
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Report templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplatesResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks:
    get:
      tags: [Reports]
      summary: List report tasks.
      operationId: listReportTasks
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskStatusFilter"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Report task page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTaskListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Reports]
      summary: Create a report generation task.
      operationId: createReportTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportTaskRequest"
            examples:
              policyTopic:
                value:
                  topic: 养老服务发展趋势
                  templateId: auto
                  sourceScope:
                    searchRunId: search_20260522_001
                    includeForumLog: true
                    orchestration:
                      enabled: true
                      insightMode: normal
                      engines: [query, media]
                  outputFormats: [html, md, pdf]
                  owner:
                    userId: user_demo
                    displayName: Demo Operator
      responses:
        "202":
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}:
    get:
      tags: [Reports]
      summary: Get a report task.
      operationId: getReportTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Report task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTaskResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Reports]
      summary: Delete a report task and its persisted artifacts.
      operationId: deleteReportTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Report task deleted.
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}/events:
    get:
      tags: [Reports]
      summary: Stream report task progress with Server-Sent Events.
      operationId: streamReportTaskEvents
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: Optional SSE resume cursor.
      responses:
        "200":
          description: SSE stream of ReportTaskEvent messages.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                progress:
                  summary: Progress event
                  value: |
                    id: 17
                    event: progress
                    data: {"id":"17","type":"progress","taskId":"report_001","timestamp":"2026-05-22T10:10:00Z","payload":{"status":"running","progress":52,"stage":"agent_running","message":"Generating chapter 3"}}

  /report-tasks/{taskId}/logs:
    get:
      tags: [Reports]
      summary: List persisted report task events as task logs.
      operationId: listReportTaskLogs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: Report task log events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLogResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}:cancel:
    post:
      tags: [Reports]
      summary: Cancel a running report task.
      operationId: cancelReportTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "202":
          description: Cancel accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}:rerun:
    post:
      tags: [Reports]
      summary: Rerun selected analysis engines for an existing report task.
      description: Re-runs only the requested Query/Media/Insight engines and reuses historical engine reports from the same task workspace for engines that are not selected.
      operationId: rerunReportTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunReportTaskRequest"
            examples:
              rerunQueryOnly:
                value:
                  engines: [query]
      responses:
        "202":
          description: Rerun accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}/result:
    get:
      tags: [Reports]
      summary: Get report result metadata and preview URL.
      operationId: getReportResult
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Report result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResultResponse"
        default:
          $ref: "#/components/responses/Error"

  /report-tasks/{taskId}/exports/{format}:
    get:
      tags: [Reports]
      summary: Download or create an exported report artifact.
      operationId: exportReport
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
        - name: format
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReportFormat"
        - name: optimizeLayout
          in: query
          schema:
            type: boolean
            default: true
          description: Applies to PDF exports.
        - name: workspaceId
          in: query
          schema:
            type: string
          description: Optional browser-download fallback when custom headers cannot be sent.
      responses:
        "200":
          description: Export file stream.
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "202":
          description: Export is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExportJobResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-strategies:
    get:
      tags: [Crawlers]
      summary: List reusable crawler strategies.
      operationId: listCrawlerStrategies
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Strategy list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerStrategyListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Crawlers]
      summary: Create a crawler strategy.
      operationId: createCrawlerStrategy
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlerStrategyInput"
            examples:
              wbStrategy:
                summary: Preserve a platform-bound Weibo policy.
                value:
                  name: 微博每日采集
                  runMode: deep_sentiment
                  platformPolicies:
                    - platformId: wb
                      enabled: true
                      crawlDepth: 3
                      maxKeywords: 10
                      maxNotesPerKeyword: 20
                      maxCommentsPerNote: 50
                      keywords: [养老服务, 医保]
                      keywordSource: manual
                      frequency:
                        mode: daily
                        timezone: Asia/Shanghai
                      loginType: qrcode
                      headless: true
      responses:
        "201":
          description: Strategy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerStrategyResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-accounts:
    get:
      tags: [Crawlers]
      summary: List crawler login accounts with non-sensitive status details.
      description: |
        Returns account metadata required by the SaaS console. Sensitive
        credentials such as cookies, tokens, passwords, and QR secrets must
        never be returned by this endpoint.
      operationId: listCrawlerAccounts
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/PlatformId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CrawlerAccountStatus"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Crawler account list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerAccountListResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-accounts/{accountId}:
    put:
      tags: [Crawlers]
      summary: Upsert a crawler login account profile without sensitive credentials.
      description: |
        Used by crawler adapters or admin tooling to register the current
        non-sensitive account profile after login or verification. Request
        bodies must not include cookies, tokens, passwords, authorization
        headers, QR secrets, or browser storage.
      operationId: upsertCrawlerAccount
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlerAccountUpsertRequest"
      responses:
        "200":
          description: Account upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerAccountResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Crawlers]
      summary: Delete a crawler login account profile.
      description: |
        Deletes the stored account metadata for the workspace. The path value
        may be the returned account `id` or the platform account identifier.
      operationId: deleteCrawlerAccount
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account deleted.
        default:
          $ref: "#/components/responses/Error"

  /crawler-accounts/login-sessions:
    post:
      tags: [Crawlers]
      summary: Open an interactive crawler account login session.
      operationId: createCrawlerAccountLoginSession
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrawlerAccountLoginSessionRequest"
      responses:
        "202":
          description: Login session opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerAccountLoginSessionResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-accounts/login-sessions/{sessionId}:
    get:
      tags: [Crawlers]
      summary: Get an interactive crawler account login session.
      operationId: getCrawlerAccountLoginSession
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Login session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerAccountLoginSessionResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-data:
    get:
      tags: [Crawlers]
      summary: Search persisted crawler records.
      operationId: listCrawlerData
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/PlatformId"
        - name: contentType
          in: query
          schema:
            type: string
            enum: [content, comment]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Crawler data page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerDataListResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Crawlers]
      summary: Delete a persisted crawler record.
      operationId: deleteCrawlerDataRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: tableName
          in: query
          required: true
          schema:
            type: string
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/PlatformId"
        - name: contentType
          in: query
          schema:
            type: string
            enum: [content, comment]
      responses:
        "200":
          description: Crawler data record deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted]
                properties:
                  success:
                    type: boolean
                    const: true
                  deleted:
                    type: integer
                  sources:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Error"

  /crawler-data:delete:
    post:
      tags: [Crawlers]
      summary: Delete multiple persisted crawler records.
      operationId: deleteCrawlerDataRecords
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlerDataBatchDeleteRequest"
      responses:
        "200":
          description: Crawler data records deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerDataDeleteResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-tasks:
    get:
      tags: [Crawlers]
      summary: List crawler tasks.
      operationId: listCrawlerTasks
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskStatusFilter"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/PlatformId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Crawler task page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerTaskListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Crawlers]
      summary: Create a crawler task.
      operationId: createCrawlerTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrawlerTaskRequest"
            examples:
              manualKeywordCrawl:
                value:
                  startDate: "2026-05-20"
                  endDate: "2026-05-22"
                  schedule:
                    mode: daily
                    timezone: Asia/Shanghai
                  crawlDepth: 3
                  platforms: [wb, xhs]
                  keywords: [养老服务, 医保支付]
                  owner:
                    userId: user_demo
                    displayName: Demo Operator
      responses:
        "202":
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-tasks/{taskId}:
    get:
      tags: [Crawlers]
      summary: Get a crawler task.
      operationId: getCrawlerTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Crawler task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerTaskResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Crawlers]
      summary: Delete a crawler task and its persisted task events.
      operationId: deleteCrawlerTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Crawler task deleted.
        default:
          $ref: "#/components/responses/Error"

  /crawler-tasks/{taskId}/logs:
    get:
      tags: [Crawlers]
      summary: List persisted crawler task events as task logs.
      operationId: listCrawlerTaskLogs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: Crawler task log events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLogResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-tasks/{taskId}:stop:
    post:
      tags: [Crawlers]
      summary: Stop a crawler task.
      operationId: stopCrawlerTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "202":
          description: Stop accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /crawler-tasks/{taskId}:retry:
    post:
      tags: [Crawlers]
      summary: Retry a failed or stopped crawler task.
      operationId: retryCrawlerTask
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "202":
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /platforms:
    get:
      tags: [Platforms]
      summary: List supported crawling platforms.
      operationId: listPlatforms
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Platform list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformListResponse"
        default:
          $ref: "#/components/responses/Error"

  /platforms/{platformId}/policy:
    get:
      tags: [Platforms]
      summary: Get platform crawling policy.
      operationId: getPlatformPolicy
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PlatformId"
      responses:
        "200":
          description: Platform policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPolicyResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Platforms]
      summary: Replace platform crawling policy.
      operationId: updatePlatformPolicy
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PlatformId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformPolicyInput"
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPolicyResponse"
        default:
          $ref: "#/components/responses/Error"

  /platforms/{platformId}/identity-lists:
    get:
      tags: [Platforms]
      summary: List allow/block user identities for a platform.
      operationId: listPlatformIdentityRules
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PlatformId"
        - name: listType
          in: query
          schema:
            $ref: "#/components/schemas/IdentityListType"
      responses:
        "200":
          description: Identity list rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRulesResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Platforms]
      summary: Add an identity allow/block rule.
      operationId: createPlatformIdentityRule
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PlatformId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRuleInput"
      responses:
        "201":
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRuleResponse"
        default:
          $ref: "#/components/responses/Error"

  /platforms/{platformId}/identity-lists/{ruleId}:
    delete:
      tags: [Platforms]
      summary: Delete an identity allow/block rule.
      operationId: deletePlatformIdentityRule
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PlatformId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule deleted.
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: User-level workspace scope. Defaults to `workspace_demo` until user accounts are introduced.
      schema:
        type: string
        default: workspace_demo
        example: workspace_demo
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    AfterEventId:
      name: afterId
      in: query
      description: Optional event id cursor; only events with larger ids are returned.
      schema:
        type: integer
        minimum: 0
    TaskStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/TaskStatus"
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ComponentId"
    PlatformId:
      name: platformId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PlatformId"

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    WorkspaceScoped:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          description: User-level workspace id. Report artifacts are stored under `workspaces/{workspaceId}/{taskId}/`.
        tenantId:
          type: string
          description: Optional parent tenant scope for future multi-tenant deployments.

    UserRef:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, operator, reviewer, service_account]

    TaskStatus:
      type: string
      enum: [queued, pending, running, succeeded, failed, cancelled, stopping, stopped]

    ReportStatus:
      type: string
      enum: [queued, pending, running, succeeded, failed, cancelled]

    CrawlerStatus:
      type: string
      enum: [queued, pending, running, succeeded, failed, stopping, stopped, cancelled]

    CrawlerAccountStatus:
      type: string
      enum: [active, login_required, expired, disabled, error, unknown]

    ComponentId:
      type: string
      enum: [query, media, insight, forum, report, mindspider, database]

    ReportEngineId:
      type: string
      enum: [query, media, insight]

    InsightMode:
      type: string
      enum: [fast, normal, deep]
      default: normal
      description: Insight Engine generation preset. Ignored by Query/Media/Report when Insight is not selected.

    ComponentStatus:
      type: string
      enum: [unknown, stopped, starting, running, degraded, failed, stopping]

    PlatformId:
      type: string
      enum: [xhs, dy, ks, bili, wb, tieba, zhihu]

    ReportFormat:
      type: string
      enum: [html, json, md, pdf]

    LogSource:
      type: string
      enum: [system, query, media, insight, forum, report, mindspider, crawler]

    LogLevel:
      type: string
      enum: [debug, info, warning, error, critical]

    IdentityListType:
      type: string
      enum: [allow, block]

    KeywordSource:
      type: string
      enum: [manual, broad_topic_extraction, mixed]

    CrawlerTaskKeywordSource:
      type: string
      enum: [manual]

    ApiErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - VALIDATION_ERROR
        - ENGINE_NOT_READY
        - TASK_ALREADY_RUNNING
        - TASK_NOT_CANCELLABLE
        - EXPORT_UNAVAILABLE
        - DEPENDENCY_MISSING
        - RATE_LIMITED
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [success, status, serverTime, version]
          properties:
            success:
              type: boolean
              const: true
            status:
              type: string
              enum: [ok, degraded, unavailable]
            serverTime:
              type: string
              format: date-time
            version:
              type: string
            currentUser:
              $ref: "#/components/schemas/UserRef"

    SystemComponent:
      type: object
      required: [id, name, status]
      properties:
        id:
          $ref: "#/components/schemas/ComponentId"
        name:
          type: string
        status:
          $ref: "#/components/schemas/ComponentStatus"
        port:
          type: integer
          description: >-
            Optional infrastructure listener port. It is not a standalone UI
            sub-application port and must not be used to infer Query, Media, or
            Insight page URLs.
        healthUrl:
          type: string
          description: Optional machine-readable health endpoint for the component.
        outputLines:
          type: integer
        lastHeartbeatAt:
          type: string
          format: date-time
        message:
          type: string

    SystemComponentsResponse:
      type: object
      required: [success, components]
      properties:
        success:
          type: boolean
          const: true
        components:
          type: array
          items:
            $ref: "#/components/schemas/SystemComponent"

    ComponentActionResponse:
      type: object
      required: [success, component]
      properties:
        success:
          type: boolean
          const: true
        component:
          $ref: "#/components/schemas/SystemComponent"
        message:
          type: string

    ConfigFieldType:
      type: string
      enum: [string, number, boolean, enum, secret, url]

    SystemConfigField:
      type: object
      required: [key, label, type, value, editable, sensitive]
      properties:
        key:
          type: string
          example: REPORT_ENGINE_API_KEY
        label:
          type: string
        group:
          type: string
          enum: [server, database, llm, search, crawler, engine]
        type:
          $ref: "#/components/schemas/ConfigFieldType"
        value:
          type: string
          description: Secret values must be masked, for example `********`.
        editable:
          type: boolean
        sensitive:
          type: boolean
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
        validation:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            pattern:
              type: string
        lastUpdatedAt:
          type: string
          format: date-time

    SystemConfigResponse:
      type: object
      required: [success, fields]
      properties:
        success:
          type: boolean
          const: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SystemConfigField"
        updatedAt:
          type: string
          format: date-time

    SystemConfigUpdateRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
        updatedBy:
          $ref: "#/components/schemas/UserRef"

    LogLine:
      type: object
      required: [id, source, level, timestamp, message]
      properties:
        id:
          type: string
        source:
          $ref: "#/components/schemas/LogSource"
        level:
          $ref: "#/components/schemas/LogLevel"
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        taskId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    LogsResponse:
      type: object
      required: [success, lines]
      properties:
        success:
          type: boolean
          const: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        nextCursor:
          type: string

    TaskLogEvent:
      type: object
      required: [id, type, taskId, timestamp, payload]
      properties:
        id:
          type: string
        type:
          type: string
          description: Persisted task event type, such as status, progress, completed, or failed.
        taskId:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    TaskLogResponse:
      type: object
      required: [success, taskId, taskType, events]
      properties:
        success:
          type: boolean
          const: true
        taskId:
          type: string
        taskType:
          type: string
          enum: [report, crawler]
        events:
          type: array
          items:
            $ref: "#/components/schemas/TaskLogEvent"

    SearchRunRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        engines:
          type: array
          items:
            $ref: "#/components/schemas/ComponentId"
          default: [query, media, insight, forum]
        owner:
          $ref: "#/components/schemas/UserRef"

    SearchRun:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, query, status, engines, createdAt]
          properties:
            id:
              type: string
            query:
              type: string
            status:
              $ref: "#/components/schemas/TaskStatus"
            engines:
              type: array
              items:
                $ref: "#/components/schemas/ComponentId"
            createdAt:
              type: string
              format: date-time
            owner:
              $ref: "#/components/schemas/UserRef"

    SearchRunResponse:
      type: object
      required: [success, run]
      properties:
        success:
          type: boolean
          const: true
        run:
          $ref: "#/components/schemas/SearchRun"

    ReportTemplate:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: "Template identifier. The virtual `auto` template asks the engine to choose one automatically."
        name:
          type: string
        filename:
          type: string
        description:
          type: string
        sizeBytes:
          type: integer

    ReportTemplatesResponse:
      type: object
      required: [success, templates]
      properties:
        success:
          type: boolean
          const: true
        templates:
          type: array
          items:
            $ref: "#/components/schemas/ReportTemplate"

    ReportSourceScope:
      type: object
      properties:
        searchRunId:
          type: string
        crawlerTaskIds:
          type: array
          items:
            type: string
        includeForumLog:
          type: boolean
          default: true
        inputFileRefs:
          type: array
          items:
            type: string
        orchestration:
          $ref: "#/components/schemas/ReportOrchestrationScope"

    ReportOrchestrationScope:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum: [single_engine, multi_engine]
          example: multi_engine
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        insightMode:
          $ref: "#/components/schemas/InsightMode"
        workspacePath:
          type: string
          description: Per-report workspace used for Query, Media, Insight, Forum, and Report artifacts.
        engines:
          description: Requested engine ids while queued, or per-engine runtime state after orchestration starts.
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ReportEngineId"
            - type: object
              additionalProperties:
                type: object
                properties:
                  status:
                    type: string
                  artifactPath:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
                  completedAt:
                    type: string
                    format: date-time
                  error:
                    type: string
        forum:
          type: object
          properties:
            status:
              type: string
            artifactPath:
              type: string
            completedAt:
              type: string
              format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    CreateReportTaskRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 1
        templateId:
          type: string
          default: auto
          description: "Use `auto` or omit the field to let the Report Engine select the best template automatically."
        customTemplate:
          type: string
        sourceScope:
          $ref: "#/components/schemas/ReportSourceScope"
        outputFormats:
          type: array
          items:
            $ref: "#/components/schemas/ReportFormat"
          default: [html]
        owner:
          $ref: "#/components/schemas/UserRef"

    RerunReportTaskRequest:
      type: object
      required: [engines]
      properties:
        engines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReportEngineId"

    ReportTask:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, topic, status, progress, createdAt, updatedAt]
          properties:
            id:
              type: string
            legacyTaskId:
              type: string
              description: Optional old `/api/report/*` task id while migration is in progress.
            topic:
              type: string
            status:
              $ref: "#/components/schemas/ReportStatus"
            progress:
              type: integer
              minimum: 0
              maximum: 100
            stage:
              type: string
              enum: [queued, prepare, io_ready, orchestrating, forum_running, data_loaded, agent_running, retry_wait, persist, completed, failed]
            templateId:
              type: string
              description: "`auto` means the Report Engine will select the template during generation."
            sourceScope:
              $ref: "#/components/schemas/ReportSourceScope"
            artifacts:
              type: array
              items:
                $ref: "#/components/schemas/ReportArtifact"
            error:
              $ref: "#/components/schemas/ErrorResponse"
            owner:
              $ref: "#/components/schemas/UserRef"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ReportArtifact:
      type: object
      required: [format, ready]
      properties:
        format:
          $ref: "#/components/schemas/ReportFormat"
        ready:
          type: boolean
        filename:
          type: string
        sizeBytes:
          type: integer
        downloadUrl:
          type: string
          description: Browser-ready export URL. Report artifact URLs include the user-level workspace id as `workspaceId`.
        expiresAt:
          type: string
          format: date-time

    ReportTaskResponse:
      type: object
      required: [success, task]
      properties:
        success:
          type: boolean
          const: true
        task:
          $ref: "#/components/schemas/ReportTask"
        eventStreamUrl:
          type: string

    ReportTaskListResponse:
      type: object
      required: [success, tasks]
      properties:
        success:
          type: boolean
          const: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ReportTask"
        nextPageToken:
          type: string

    ReportTaskEvent:
      type: object
      required: [id, type, taskId, timestamp, payload]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [status, progress, stage, log, warning, html_ready, completed, error, cancelled, heartbeat]
        taskId:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    ReportResultResponse:
      type: object
      required: [success, taskId, htmlPreviewUrl, artifacts]
      properties:
        success:
          type: boolean
          const: true
        taskId:
          type: string
        htmlPreviewUrl:
          type: string
        htmlContent:
          type: string
          description: Optional inline HTML for trusted internal previews.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ReportArtifact"

    ReportExportJobResponse:
      type: object
      required: [success, exportJobId, status]
      properties:
        success:
          type: boolean
          const: true
        exportJobId:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"

    CrawlerRunMode:
      type: string
      enum: [topic_extraction, deep_sentiment, full_workflow]

    CrawlFrequency:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [manual, hourly, daily, weekly, cron]
        cron:
          type: string
        timezone:
          type: string
          default: Asia/Shanghai

    CrawlerSentiment:
      type: string
      enum: [positive, neutral, negative, unknown]
      description: Normalized sentiment of the crawled content.

    PlatformPolicyInput:
      type: object
      required: [enabled, crawlDepth, keywords, maxCommentsPerNote, frequency]
      properties:
        enabled:
          type: boolean
        crawlDepth:
          type: integer
          minimum: 1
          maximum: 10
          description: Logical crawl depth for platform-specific adapters.
        maxKeywords:
          type: integer
          minimum: 1
          maximum: 500
        maxNotesPerKeyword:
          type: integer
          minimum: 1
          maximum: 1000
        maxCommentsPerNote:
          type: integer
          minimum: 0
          maximum: 5000
        keywords:
          type: array
          items:
            type: string
        keywordSource:
          $ref: "#/components/schemas/KeywordSource"
        frequency:
          $ref: "#/components/schemas/CrawlFrequency"
        loginType:
          type: string
          enum: [qrcode, phone, cookie]
        headless:
          type: boolean

    PlatformPolicy:
      allOf:
        - $ref: "#/components/schemas/PlatformPolicyInput"
        - type: object
          required: [platformId, updatedAt]
          properties:
            platformId:
              $ref: "#/components/schemas/PlatformId"
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              $ref: "#/components/schemas/UserRef"

    StrategyPlatformPolicyInput:
      allOf:
        - type: object
          required: [platformId]
          properties:
            platformId:
              $ref: "#/components/schemas/PlatformId"
        - $ref: "#/components/schemas/PlatformPolicyInput"

    PlatformPolicyResponse:
      type: object
      required: [success, policy]
      properties:
        success:
          type: boolean
          const: true
        policy:
          $ref: "#/components/schemas/PlatformPolicy"

    CrawlerStrategyInput:
      type: object
      required: [name, runMode, platformPolicies]
      properties:
        name:
          type: string
        runMode:
          $ref: "#/components/schemas/CrawlerRunMode"
        platformPolicies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyPlatformPolicyInput"
        owner:
          $ref: "#/components/schemas/UserRef"

    CrawlerStrategy:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, name, runMode, platformPolicies, createdAt, updatedAt]
          properties:
            id:
              type: string
            name:
              type: string
            runMode:
              $ref: "#/components/schemas/CrawlerRunMode"
            platformPolicies:
              type: array
              items:
                $ref: "#/components/schemas/PlatformPolicy"
            owner:
              $ref: "#/components/schemas/UserRef"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CrawlerStrategyResponse:
      type: object
      required: [success, strategy]
      properties:
        success:
          type: boolean
          const: true
        strategy:
          $ref: "#/components/schemas/CrawlerStrategy"

    CrawlerStrategyListResponse:
      type: object
      required: [success, strategies]
      properties:
        success:
          type: boolean
          const: true
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerStrategy"

    CrawlerAccountDetails:
      type: object
      description: Non-sensitive account details suitable for UI display.
      additionalProperties: true

    CrawlerAccount:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, platformId, accountId, status, createdAt, updatedAt]
          properties:
            id:
              type: string
            platformId:
              $ref: "#/components/schemas/PlatformId"
            accountId:
              type: string
            status:
              $ref: "#/components/schemas/CrawlerAccountStatus"
            username:
              type: string
            displayName:
              type: string
            avatarUrl:
              type: string
              format: uri
            profileUrl:
              type: string
              format: uri
            loginType:
              type: string
              enum: [qrcode, phone, cookie]
            lastLoginAt:
              type: string
              format: date-time
            lastCheckedAt:
              type: string
              format: date-time
            details:
              $ref: "#/components/schemas/CrawlerAccountDetails"
            error:
              $ref: "#/components/schemas/ErrorResponse"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CrawlerAccountUpsertRequest:
      type: object
      required: [platformId, status]
      properties:
        platformId:
          $ref: "#/components/schemas/PlatformId"
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        profileUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/CrawlerAccountStatus"
        loginType:
          type: string
          enum: [qrcode, phone, cookie]
        lastLoginAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        details:
          $ref: "#/components/schemas/CrawlerAccountDetails"
        error:
          $ref: "#/components/schemas/ErrorResponse"

    CrawlerAccountResponse:
      type: object
      required: [success, account]
      properties:
        success:
          type: boolean
          const: true
        account:
          $ref: "#/components/schemas/CrawlerAccount"

    CrawlerAccountListResponse:
      type: object
      required: [success, accounts]
      properties:
        success:
          type: boolean
          const: true
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerAccount"
        nextPageToken:
          type: string

    CreateCrawlerAccountLoginSessionRequest:
      type: object
      required: [platformId]
      properties:
        platformId:
          $ref: "#/components/schemas/PlatformId"
        loginType:
          type: string
          enum: [qrcode, phone, cookie]
          default: qrcode
        headless:
          type: boolean
          default: true
        timeoutSeconds:
          type: integer
          minimum: 30
          maximum: 900
          default: 300

    CrawlerAccountLoginSession:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, platformId, loginType, status, loginUrl, createdAt, updatedAt]
          properties:
            id:
              type: string
            platformId:
              $ref: "#/components/schemas/PlatformId"
            loginType:
              type: string
              enum: [qrcode, phone, cookie]
            status:
              type: string
              enum: [opening, waiting, completed, failed]
            loginUrl:
              type: string
              format: uri
            message:
              type: string
            observedStateNames:
              type: array
              items:
                type: string
            observedStateCount:
              type: integer
            loginPreviewImage:
              type: string
              description: Data URL image preview of the QR code or login page.
            loginPreviewKind:
              type: string
              enum: [qrcode, page]
            loginPreviewUpdatedAt:
              type: string
              format: date-time
            account:
              $ref: "#/components/schemas/CrawlerAccount"
            error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time

    CrawlerAccountLoginSessionResponse:
      type: object
      required: [success, session]
      properties:
        success:
          type: boolean
          const: true
        session:
          $ref: "#/components/schemas/CrawlerAccountLoginSession"

    CrawlerDataRecord:
      type: object
      required: [id, platformId, contentType, tableName, sourceId, title, textSnippet]
      properties:
        id:
          type: string
        platformId:
          $ref: "#/components/schemas/PlatformId"
        contentType:
          type: string
          enum: [content, comment]
        tableName:
          type: string
        sourceId:
          type: string
        title:
          type: string
        textSnippet:
          type: string
        author:
          type: string
        keyword:
          type: string
        url:
          type: string
          format: uri
        createdAt:
          oneOf:
            - type: string
            - type: number
        scrapedAt:
          oneOf:
            - type: string
            - type: number
        sentiment:
          $ref: "#/components/schemas/CrawlerSentiment"
        metrics:
          type: object
          additionalProperties: true

    CrawlerDataSummary:
      type: object
      properties:
        totalRecords:
          type: integer
        byPlatform:
          type: object
          additionalProperties:
            type: integer
        byType:
          type: object
          additionalProperties:
            type: integer

    PageInfo:
      type: object
      required: [page, pageSize, totalRecords, totalPages, hasPreviousPage, hasNextPage]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
        totalPages:
          type: integer
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean

    CrawlerDataListResponse:
      type: object
      required: [success, records, summary, pageInfo]
      properties:
        success:
          type: boolean
          const: true
        records:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerDataRecord"
        summary:
          $ref: "#/components/schemas/CrawlerDataSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
        source:
          type: string
        message:
          type: string

    CrawlerDataDeleteItem:
      type: object
      required: [tableName, sourceId]
      properties:
        tableName:
          type: string
        sourceId:
          type: string
        platform:
          $ref: "#/components/schemas/PlatformId"
        contentType:
          type: string
          enum: [content, comment]

    CrawlerDataBatchDeleteRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/CrawlerDataDeleteItem"

    CrawlerDataDeleteResponse:
      type: object
      required: [success, deleted]
      properties:
        success:
          type: boolean
          const: true
        deleted:
          type: integer
        deletedRecords:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerDataDeleteItem"
        failedRecords:
          type: array
          items:
            type: object
            additionalProperties: true

    CreateCrawlerTaskRequest:
      type: object
      required: [platforms, keywords]
      properties:
        strategyId:
          type: string
        runMode:
          $ref: "#/components/schemas/CrawlerRunMode"
          default: deep_sentiment
        targetDate:
          type: string
          format: date
          deprecated: true
          description: Backward-compatible single-day crawl date. Prefer startDate and endDate.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        schedule:
          $ref: "#/components/schemas/CrawlFrequency"
        platforms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlatformId"
        keywords:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
        keywordSource:
          $ref: "#/components/schemas/CrawlerTaskKeywordSource"
          default: manual
        crawlDepth:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Logical crawl depth for this crawler task.
        maxNotesPerKeyword:
          type: integer
          minimum: 1
          maximum: 1000
        maxCommentsPerNote:
          type: integer
          minimum: 0
          maximum: 5000
        loginType:
          type: string
          enum: [qrcode, phone, cookie]
        headless:
          type: boolean
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/PlatformPolicyInput"
        owner:
          $ref: "#/components/schemas/UserRef"

    CrawlerTask:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScoped"
        - type: object
          required: [id, runMode, status, progress, platforms, keywords, keywordSource, crawlDepth, createdAt, updatedAt]
          properties:
            id:
              type: string
            runMode:
              $ref: "#/components/schemas/CrawlerRunMode"
            status:
              $ref: "#/components/schemas/CrawlerStatus"
            progress:
              type: integer
              minimum: 0
              maximum: 100
            strategyId:
              type: string
            targetDate:
              type: string
              format: date
              deprecated: true
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
            schedule:
              $ref: "#/components/schemas/CrawlFrequency"
            platforms:
              type: array
              items:
                $ref: "#/components/schemas/PlatformId"
            keywords:
              type: array
              items:
                type: string
            keywordSource:
              $ref: "#/components/schemas/CrawlerTaskKeywordSource"
            crawlDepth:
              type: integer
              minimum: 1
              maximum: 10
            stats:
              $ref: "#/components/schemas/CrawlerStats"
            error:
              $ref: "#/components/schemas/ErrorResponse"
            owner:
              $ref: "#/components/schemas/UserRef"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CrawlerStats:
      type: object
      properties:
        totalKeywords:
          type: integer
        totalPlatforms:
          type: integer
        totalTasks:
          type: integer
        successfulTasks:
          type: integer
        failedTasks:
          type: integer
        totalNotes:
          type: integer
        totalComments:
          type: integer
        platformSummary:
          type: object
          additionalProperties:
            type: object
            properties:
              successfulKeywords:
                type: integer
              failedKeywords:
                type: integer
              totalNotes:
                type: integer
              totalComments:
                type: integer
              sentiment:
                type: object
                properties:
                  processed:
                    type: integer
                  updated:
                    type: integer
                  failed:
                    type: integer
                  disabled:
                    type: boolean
                  error:
                    type: string
                  tables:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        processed:
                          type: integer
                        updated:
                          type: integer
                        failed:
                          type: integer

    CrawlerTaskResponse:
      type: object
      required: [success, task]
      properties:
        success:
          type: boolean
          const: true
        task:
          $ref: "#/components/schemas/CrawlerTask"

    CrawlerTaskListResponse:
      type: object
      required: [success, tasks]
      properties:
        success:
          type: boolean
          const: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/CrawlerTask"
        nextPageToken:
          type: string

    Platform:
      type: object
      required: [id, name, enabled]
      properties:
        id:
          $ref: "#/components/schemas/PlatformId"
        name:
          type: string
        enabled:
          type: boolean
        crawlerType:
          type: string
          enum: [search, detail, creator]
        policy:
          $ref: "#/components/schemas/PlatformPolicy"
        identityRuleCounts:
          type: object
          properties:
            allow:
              type: integer
            block:
              type: integer
        accountCounts:
          type: object
          properties:
            active:
              type: integer
            loginRequired:
              type: integer
            expired:
              type: integer
            disabled:
              type: integer
            error:
              type: integer
            unknown:
              type: integer

    PlatformListResponse:
      type: object
      required: [success, platforms]
      properties:
        success:
          type: boolean
          const: true
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"

    IdentityRuleInput:
      type: object
      required: [listType, userId]
      properties:
        listType:
          $ref: "#/components/schemas/IdentityListType"
        userId:
          type: string
        label:
          type: string
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/UserRef"

    IdentityRule:
      allOf:
        - $ref: "#/components/schemas/IdentityRuleInput"
        - type: object
          required: [id, platformId, createdAt]
          properties:
            id:
              type: string
            platformId:
              $ref: "#/components/schemas/PlatformId"
            createdAt:
              type: string
              format: date-time

    IdentityRuleResponse:
      type: object
      required: [success, rule]
      properties:
        success:
          type: boolean
          const: true
        rule:
          $ref: "#/components/schemas/IdentityRule"

    IdentityRulesResponse:
      type: object
      required: [success, rules]
      properties:
        success:
          type: boolean
          const: true
        rules:
          type: array
          items:
            $ref: "#/components/schemas/IdentityRule"
